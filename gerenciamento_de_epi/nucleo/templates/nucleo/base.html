{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/css.css' %}">
    <title>{% block title %}Controle de EPI{% endblock %}</title>
</head>
<body>

    <!-- CONTAINER PRINCIPAL -->
    <div class="dashboard-container">
        
        <!-- BARRA LATERAL (SIDEBAR) -->
        <nav class="sidebar-menu">
            <a href="{% url 'nucleo:home' %}" class="menu-item">Início</a>
            <a href="{% url 'nucleo:colaborador_lista' %}" class="menu-item">Colaboradores</a>
            <a href="{% url 'nucleo:epi_lista' %}" class="menu-item">EPI</a>
            <!-- Empréstimos: 
            <a href="{ % url 'nucleo:emprestimos' % }" class="menu-item">Empréstimos</a>
            -->
        </nav>

    
        <div class="main-layout">
            
            <header class="main-header">
                <!-- Imagem Clicável que redireciona para o Início -->
                <a href="{% url 'nucleo:home' %}" class="header-logo-link">
                    <img src="{% static 'css/logo.png' %}" alt="Logo Início" class="header-logo">
                </a>
                <div class="user-info">
                    <span>Olá, Usuário</span>
                    <button class="btn-logout">Sair</button>
                </div>
            </header>

            <!-- CONTEÚDO DINÂMICO-->
            <main class="conteudo">
                 {% block conteudo %}{% endblock %}
            </main>

        </div>

    </div>

</body>
</html>
