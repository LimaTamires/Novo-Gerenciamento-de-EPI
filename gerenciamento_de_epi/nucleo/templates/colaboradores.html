{% extends "base.html" %}

{% block title %}Editar colaborador{% endblock %}
{% block page_title %}Editar colaborador{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-lg-8">
            <div class="card card-primary card-outline">
                <div class="card-header">
                    <h3 class="card-title">Informações do colaborador</h3>
                </div>

                <form action="{% url 'home' colaborador.id %}" method="post">
                    {% csrf_token %}
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label" for="nome">Nome</label>
                            <input class="form-control" id="nome" type="text" name="nome" autocomplete="name" required value="{{ Colaboradores.nome }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="telefone">Telefone</label>
                            <input class="form-control" id="telefone" type="tel" name="telefone" autocomplete="tel" value="{{ Colaboradores.telefone }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="sertor">Setor</label>
                            <select class="form-control" id="setor" name="setor" >
                                <option>Selecione um</option>
                                {% for setor in setores %}
                                <option value="{{ setor.id }}" {% if setor.id == Colaboradores.setor.id %}selected=selected{% endif %} >{{ setor.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="card-footer d-flex justify-content-end gap-2">
                        <a class="btn btn-secondary" href="{% url 'home' %}">Cancelar</a>
                        <button class="btn btn-primary" type="submit">Salvar alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
